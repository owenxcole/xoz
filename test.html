    <linearGradient id="grad181e1b" x1="0%" y1="0%" x2="100%" y2="0%">

    <style>
      /* #2d543d — slow breathing pulse */
      [style*="#2d543d" i] {
        animation: pulseGreen 3.2s ease-in-out infinite;
        transform-box: fill-box;
        transform-origin: center;
      }
      @keyframes pulseGreen {
        0%, 100% { opacity: .78; filter: drop-shadow(0 0 0 rgba(45,84,61,0)); }
        50% { opacity: 1; filter: drop-shadow(0 0 4px rgba(45,84,61,.65)); }
      }

      /* #3c5b49 — restrained digital glitch */
      [style*="#3c5b49" i] {
        animation: glitchGreen 5.8s steps(1,end) infinite;
      }
      @keyframes glitchGreen {
        0%, 88%, 91%, 100% { transform: translate(0,0); opacity: 1; }
        89% { transform: translate(1.5px,-.6px); opacity: .78; }
        90% { transform: translate(-1px,.5px); opacity: .92; }
      }

      /* #11331f — slow fade in / fade out */
      [style*="#11331f" i] {
        animation: fadeGreen 8s ease-in-out infinite;
      }
      @keyframes fadeGreen {
        0%, 100% { opacity: .28; }
        50% { opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        [style*="#2d543d" i],
        [style*="#3c5b49" i], [style*="#11331f" i] {
          animation: none !important;
        }
        linearGradient animateTransform { display: none; }
      }
    </style>
